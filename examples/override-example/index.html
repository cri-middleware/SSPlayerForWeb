<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSPlayerForWeb - Override Layer API Example</title>
    <!-- PIXI_IMPORT_MAP -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; background: linear-gradient(135deg, #1f1c2c 0%, #928DAB 100%); display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: 'Inter', sans-serif; color: #fff; }
        #canvas-container { position: relative; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); border-radius: 16px; overflow: hidden; }
        canvas { display: block; }

        /* Status readout, mirroring the on-screen label the Godot / Unity
           Override_Ringo demos draw in the top-left corner. */
        #status {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            z-index: 10;
            pointer-events: none;
        }

        #step {
            font-size: 22px;
            font-weight: 600;
            text-shadow: 0 0 6px #000, 0 2px 4px #000;
        }

        #call {
            margin-top: 8px;
            display: inline-block;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 14px;
            background: rgba(0, 0, 0, 0.55);
            border-radius: 8px;
            padding: 8px 12px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <div id="canvas-container">
        <div id="status">
            <div id="step">Loading…</div>
            <div id="call"></div>
        </div>
        <!-- Canvas is injected here -->
    </div>

    <script type="module" src="/src/main.ts"></script>
</body>
</html>
