<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebGL Example</title>
  <style>
    body { margin: 0; padding: 0; overflow: hidden; background-color: #333; font-family: sans-serif;
           display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    /* The drawing buffer is a fixed 1280x960; show it at its native pixel size
       (no CSS scaling) so it renders pixel-by-pixel (crisp), centered in the
       window. Drawing cost stays fixed at 1280x960 regardless of window size. */
    canvas { display: block; }
    #panel {
      position: absolute; top: 10px; left: 10px; z-index: 10;
      background: rgba(0,0,0,0.55); padding: 10px; color: #fff; border-radius: 6px;
      display: flex; flex-direction: column; gap: 8px; max-width: 60vw;
    }
    #panel .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    #panel select { font-size: 15px; padding: 5px; max-width: 320px; }
    #panel label { font-size: 12px; opacity: 0.8; }
    #status { font-size: 12px; opacity: 0.85; word-break: break-all; }
    #hint { font-size: 11px; opacity: 0.6; }
    /* Full-window drop overlay */
    #drop-overlay {
      position: fixed; inset: 0; z-index: 100; pointer-events: none;
      display: none; align-items: center; justify-content: center;
      background: rgba(30,80,160,0.35); border: 4px dashed rgba(255,255,255,0.8);
      color: #fff; font-size: 24px; box-sizing: border-box;
    }
    #drop-overlay.active { display: flex; }
  </style>
</head>
<body>
  <div id="panel">
    <div class="row">
      <label for="ssab-select">SSAB</label>
      <select id="ssab-select">
        <option value="/overall/Basic.ssab">Basic.ssab</option>
        <option value="/overall/Shape.ssab">Shape.ssab</option>
        <option value="/overall/PartsColor.ssab">PartsColor.ssab</option>
        <option value="/overall/Mesh.ssab">Mesh.ssab</option>
        <option value="/Ringo/Ringo.ssab">Ringo.ssab</option>
        <option value="/overall/Effect.ssab">Effect.ssab</option>
        <option value="/overall/Mask.ssab">Mask.ssab</option>
        <option value="/overall/Instance.ssab">Instance.ssab</option>
        <option value="/overall/BlendMode.ssab">BlendMode.ssab</option>
        <option value="/overall/Shader.ssab">Shader.ssab</option>
        <optgroup label="Events (fire on onAudio / onUserData / onSignal)">
          <option value="/overall/Sound.ssab">Sound.ssab (♪ auto-plays audio)</option>
          <option value="/overall/UserData.ssab">UserData.ssab</option>
          <option value="/overall/Signal.ssab">Signal.ssab</option>
        </optgroup>
        <optgroup label="Embedded (textures inlined, no sibling PNG)">
          <option value="/overall/Basic_embedded.ssab">Basic (embedded)</option>
          <option value="/overall/PartsColor_embedded.ssab">PartsColor (embedded)</option>
          <option value="/overall/Mesh_embedded.ssab">Mesh (embedded)</option>
          <option value="/overall/Mask_embedded.ssab">Mask (embedded)</option>
          <option value="/overall/Effect_embedded.ssab">Effect (embedded)</option>
          <option value="/overall/BlendMode_embedded.ssab">BlendMode (embedded)</option>
          <option value="/overall/Shader_embedded.ssab">Shader (embedded)</option>
        </optgroup>
      </select>
      <label for="animation-select">Animation</label>
      <select id="animation-select" disabled></select>
    </div>
    <div id="status">Initializing…</div>
    <div id="hint">Tip: drag &amp; drop a folder containing an .ssab and its textures to play your own asset.</div>
  </div>
  <canvas id="view"></canvas>
  <div id="drop-overlay">Drop an ssab folder to play</div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
