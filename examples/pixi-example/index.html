<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSPlayerForWeb - PixiJS Example</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; background: linear-gradient(135deg, #1f1c2c 0%, #928DAB 100%); display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: 'Inter', sans-serif; color: #fff; }
        #canvas-container { position: relative; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); border-radius: 16px; overflow: hidden; }
        canvas { display: block; }
        
        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            z-index: 10;
        }

        button {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(1px);
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            align-items: center;
        }

        .control-group label {
            font-size: 12px;
            opacity: 0.8;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 150px;
            background: transparent;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            margin-top: -6px;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
        }

        input[type="range"]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 2px;
        }

        #frame-display {
            font-variant-numeric: tabular-nums;
            min-width: 50px;
            text-align: right;
            font-size: 14px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div id="canvas-container">
        <!-- Canvas will be injected here -->
        <div id="controls">
            <button id="btn-play-pause">Pause</button>
            
            <div class="control-group">
                <label for="seek-bar">Timeline</label>
                <input type="range" id="seek-bar" min="0" max="100" value="0" step="0.1">
            </div>
            
            <div id="frame-display">0 / 0</div>

            <div class="control-group">
                <label for="speed-bar">Speed: <span id="speed-display">1.0</span>x</label>
                <input type="range" id="speed-bar" min="0.1" max="3.0" value="1.0" step="0.1">
            </div>
        </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
