name: Docs

# Builds the site the way pages.yml publishes it, so a broken page surfaces
# before a release publishes it.
#
# A pull request that touches the site's sources runs this on its own, and
# builds the docs alone: the packages, the examples and ssconverter-web wait
# for ci.yml, which calls this for the weekly run and a dispatch. ci.yml cannot
# carry the pull-request half itself, because it ignores a change to Markdown
# alone, and the docs are almost nothing else.
on:
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/prepare-docs.*'
      - 'scripts/build-docs.*'
      - 'scripts/build-pages.*'
      - '.github/workflows/docs.yml'
  workflow_call:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 📚 Pages site
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout (with SpriteStudio-SDK submodule)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      # The SDK wasm comes from the submodule, not the release SDK_VERSION.txt
      # names: that is pages.yml's to publish with. The key is ci.yml's, so the
      # build its weekly run saves is restored here, and only on a miss does this
      # job compile it. TypeDoc reads the wasm's types, so the docs alone need it.
      - name: Name the SDK wasm build
        id: wasm
        run: echo "key=wasm-${ImageOS}-release-$(git rev-parse HEAD:SpriteStudio-SDK)-${{ hashFiles('scripts/build-runtime.sh', '.github/workflows/ci.yml') }}" >> "$GITHUB_OUTPUT"

      - name: Restore the SDK wasm build
        id: wasm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/ssplayer-core/wasm
            packages/ssplayer-core/wasm-nosimd
            packages/ssconverter-core/wasm
          key: ${{ steps.wasm.outputs.key }}

      - name: Setup Rust toolchain
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          # Pinned by SHA, so the channel must be named explicitly here.
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Setup Rust cache
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: SpriteStudio-SDK
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install wasm-pack
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: wasm-pack

      - name: Build the SDK wasm
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: ./scripts/build-runtime.sh build=release

      # sdk=build so the ssconverter stage converts with this wasm as well;
      # skip=wasm because the steps above already put it in place.
      - name: Build site
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          SKIP: ${{ github.event_name == 'pull_request' && 'wasm,packages,assets,rmmz,tyranoscript,examples,ssconverter' || 'wasm' }}
        run: ./scripts/build-pages.sh base="/$REPO_NAME/" out=_site sdk=build skip="$SKIP"
