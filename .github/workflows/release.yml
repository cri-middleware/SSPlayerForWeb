name: Release

# One-shot release, triggered manually from main. Two independent boolean inputs
# (both default true) select what this dispatch uploads. Same ref + same inputs
# always produce the same result, so the run stays deterministic:
#
#   publish_npm=true      Consume the accumulated changesets: `changeset version`
#                         bumps each affected package's version + CHANGELOG
#                         (independent versioning), commit to main, build every
#                         package (wasm fetched first), publish the PUBLIC ones to
#                         npm (per-package `prepack` guard refuses a package whose
#                         dist/wasm is missing), and push the commit + per-package
#                         tags. No changesets pending is NOT a no-op: `changeset
#                         publish` still ships any package whose CURRENT version is
#                         absent from the registry, which is what makes the very
#                         first release (and a retry after a half-failed one)
#                         possible. Everything already published -> no-op.
#
#   release_plugins=true  The PRIVATE plugins (ssplayer-rmmz / ssplayer-tyranoscript /
#                         ssplayer-tyranobuilder) are
#                         never on npm, so GitHub Releases are their only channel.
#                         changeset does not tag private packages: pack each plugin
#                         whose current-version Release does not exist yet and cut
#                         one Release per plugin, tagged `<pkg>@<version>`
#                         (prerelease when the version contains a `-`). Already
#                         released -> skipped, so re-runs and deferred plugin
#                         releases are safe.
#
# Common cases: defaults (true/true) = full release. release_plugins=false ships
# npm only (cut the plugin Releases later with publish_npm=false + release_plugins
# =true). Hold a plugin persistently by adding it to `ignore` in
# .changeset/config.json instead.
#
# Prerelease lines are handled by changesets' pre mode (`.changeset/pre.json`):
# while it is active, `changeset version` produces `X.Y.Z-<tag>.N` and publishes
# under that dist-tag instead of `latest`. Note this applies to a brand-new
# package too, so while pre mode is on there is NO `latest` tag and
# `npm install <pkg>` fails — consumers must ask for `<pkg>@<tag>` until
# `pnpm changeset pre exit` + a release ends the line.
#
# Runs on `main` only: the version-bump commit, the tags, and the published
# code all follow whichever ref the workflow is dispatched from, so a release
# must originate from main. Requires the `SS_NPM_TOKEN` secret (an npm automation
# token — automation tokens bypass 2FA, which CI cannot satisfy interactively).
on:
  workflow_dispatch:
    inputs:
      publish_npm:
        description: 'Publish public packages to npm (changeset version + publish)'
        type: boolean
        default: true
      release_plugins:
        description: 'Cut GitHub Releases for private plugins (rmmz / tyrano / tyranobuilder)'
        type: boolean
        default: true

# Never let two releases run at once.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # push the version-bump commit + tags back to main
  id-token: write # npm provenance (see NPM_CONFIG_PROVENANCE below)

jobs:
  release:
    # Refuse to publish from anywhere but main, even if dispatched on another ref.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with SpriteStudio-SDK submodule)
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Gate the whole release on a green build + test run. An npm version is
      # immutable once published, so this must fail BEFORE anything is versioned
      # or uploaded. `build` doubles as the typecheck (tsdown emits .d.ts, which
      # fails on type errors); `test` needs the wasm, hence download:wasm first.
      # ci:publish re-runs download+build afterwards against the bumped versions
      # — the duplicate work is a few seconds and keeps the publish self-contained.
      - name: Verify (build + test)
        run: |
          pnpm run download:wasm
          pnpm run build
          pnpm run test

      - name: Version, publish (npm) and release plugins (GitHub Releases)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.SS_NPM_TOKEN }}
          # npm provenance attestation needs a PUBLIC repository (plus the
          # id-token: write permission above, which is already granted). This
          # repo is still private, and npm rejects the publish outright rather
          # than degrading, so provenance stays off. Flip to 'true' the moment
          # the repo goes public — nothing else has to change.
          NPM_CONFIG_PROVENANCE: 'false'
          # gh CLI auth for the plugin GitHub Releases (contents: write above).
          GH_TOKEN: ${{ github.token }}
          PUBLISH_NPM: ${{ inputs.publish_npm }}
          RELEASE_PLUGINS: ${{ inputs.release_plugins }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          built=0

          # --- npm channel (public packages) ------------------------------------
          if [ "$PUBLISH_NPM" = "true" ]; then
            # Consume accumulated changesets -> bump versions + CHANGELOG.
            pnpm changeset version

            # Repoint the version-pinned CDN/esm.sh snippets in the READMEs, the
            # docs site and examples/cdn at whatever the manifests now say. These
            # exist to be copy-pasted, and versions move independently per package,
            # so without this a release that bumps one package leaves every snippet
            # naming it pointing at a version that no longer pairs correctly.
            # Runs before the status check below so the rewrite lands in the same
            # commit as the bump.
            node scripts/sync-doc-versions.mjs

            # An empty tree here only means "no version changed" — it does NOT
            # mean "nothing to publish". `changeset publish` compares each
            # package against the registry and ships whatever is missing, which
            # is how the FIRST release goes out (versions already committed, no
            # changeset to consume) and how a run that died between publish and
            # `git push` recovers. So always fall through to publish.
            bumped=0
            if [ -n "$(git status --porcelain)" ]; then
              # Commit the bump (new CHANGELOG.md files are untracked, so add -A).
              git add -A
              git commit -m "chore: release packages"
              bumped=1
            else
              echo "::notice::No changesets pending — publishing the current versions as-is (no-op if already on npm)."
            fi

            # ci:publish = download:wasm && build && changeset publish.
            pnpm run ci:publish
            built=1

            # Push the bump commit first (only when there was one), then the
            # per-package tags changeset created for what it actually published.
            # They are lightweight tags, so --follow-tags would skip them.
            if [ "$bumped" = "1" ]; then
              git push origin HEAD:main
            fi
            git push origin --tags
          else
            echo "::notice::publish_npm=false — skipping npm version bump & publish."
          fi

          # --- GitHub Releases channel (private plugins) --------------------------
          # Never on npm, so GitHub Releases are their only distribution channel.
          if [ "$RELEASE_PLUGINS" = "true" ]; then
            # Plugins are packed from build outputs; make sure they exist even when
            # the npm half was skipped or was a no-op.
            if [ "$built" = "0" ]; then
              pnpm run download:wasm
              pnpm run build
            fi
            release_sha="$(git rev-parse HEAD)"
            # changeset does not tag private packages. Cut one Release per plugin
            # whose current-version Release is absent; already released -> skip, so
            # re-runs and deferred plugin releases stay idempotent.
            # $3 is the artifact path under packages/<dir>/, with %v standing in
            # for the version. Most plugins carry it in the filename; the
            # TyranoBuilder one cannot (see below), so the tag is what dates it.
            release_plugin() {
              local pkg="$1" dir="$2" pattern="$3"
              local version tag artifact prerelease
              version="$(node -p "require('./packages/${dir}/package.json').version")"
              tag="${pkg}@${version}"
              if gh release view "$tag" >/dev/null 2>&1; then
                echo "::notice::${tag} already released — skipping."
                return 0
              fi
              pnpm --filter "$pkg" run pack
              artifact="packages/${dir}/${pattern//%v/$version}"
              prerelease=""
              case "$version" in *-*) prerelease="--prerelease";; esac
              gh release create "$tag" "$artifact" \
                --target "$release_sha" \
                --title "${pkg} ${version}" \
                --generate-notes \
                $prerelease
              echo "::notice::Released ${tag}"
            }
            release_plugin "@spritestudio/ssplayer-rmmz"   ssplayer-rmmz   'dist/pack/ssplayer-rmmz-plugin-%v.zip'
            release_plugin "@spritestudio/ssplayer-tyranoscript" ssplayer-tyranoscript 'dist/pack/ssplayer-tyranoscript-plugin-%v.zip'
            # ssplayer.tbp keeps that exact name on purpose: TyranoBuilder derives
            # the plugin id from the filename and then looks for <id>/<id>.builder.js
            # inside the archive, so `ssplayer-1.2.0.tbp` would install nothing.
            release_plugin "@spritestudio/ssplayer-tyranobuilder" ssplayer-tyranobuilder 'dist/pack/ssplayer.tbp'
          else
            echo "::notice::release_plugins=false — skipping plugin GitHub Releases."
          fi
