name: Release

# One release, dispatched by hand from main. A maintainer names the versions;
# everything after that is this workflow's, and the same ref with the same inputs
# always produces the same result:
#
#   versions          `<package>@<version>` pairs separated by spaces, <package>
#                     being the directory under packages/. scripts/set-versions.mjs
#                     writes them and turns each package's `## [Unreleased]` notes
#                     into that version's CHANGELOG.md section, and
#                     sync-doc-versions.mjs repoints the version-pinned docs
#                     snippets, in one commit that reaches main only once the build
#                     below has passed. Empty sets nothing and releases whatever
#                     current version is not released yet: the retry after a run
#                     that died halfway.
#
#   publish_npm       Each PUBLIC package's tarball -- the very file
#                     scripts/build-release.sh packed and checked -- is staged on
#                     npm through trusted publishing, unless npm already has that
#                     version, staged or published. Nothing is public until a
#                     maintainer approves it with 2FA, on npmjs.com or with
#                     `npm stage approve`. A version with a prerelease part
#                     (X.Y.Z-beta.N) is staged under that word's dist-tag, so
#                     `latest` stays on the last full release and a consumer asks
#                     for `<pkg>@beta` meanwhile. Off, the public packages still
#                     get their Releases, tarball attached. That is how a
#                     package's first version ships: npm sets up a trusted
#                     publisher only for a package it already has, so a
#                     maintainer publishes that version by hand from the tarball
#                     (RELEASING.md).
#
#   release_plugins   The PRIVATE plugins (ssplayer-rmmz / ssplayer-tyranoscript /
#                     ssplayer-tyranobuilder) are never on npm; their Release, with
#                     the archive attached, is their only channel.
#
# Every package released here gets a `<package>-v<version>` tag and a DRAFT
# GitHub Release carrying its file -- the npm tarball, or the plugin's archive --
# and a link to its CHANGELOG.md, which is where the notes are.
# A package whose Release already exists, draft or not, is skipped, so a re-run
# never doubles one. A maintainer checks each draft and publishes it, and
# publishing is what starts pages.yml.
#
# Staging needs no secret. Each public package on npm has a trusted publisher
# for this repository and this workflow file, allowed to stage, and the job's
# id-token is what npm trusts.
on:
  workflow_dispatch:
    inputs:
      versions:
        description: 'Versions to set: <package>@<version>, space separated, <package> = directory under packages/. Empty releases the current versions.'
        type: string
        default: ''
      publish_npm:
        description: 'Stage the public packages on npm, for a maintainer to approve (their Releases are drafted either way)'
        type: boolean
        default: true
      release_plugins:
        description: 'Draft the Releases of the private plugins (rmmz / tyranoscript / tyranobuilder)'
        type: boolean
        default: true

# Never let two releases run at once.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    # Refuse to release from anywhere but main, even if dispatched on another ref.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write # the version commit, the tags and the Releases
      id-token: write # trusted publishing on npm
    steps:
      # The only checkout that keeps its credentials: this job pushes the version
      # commit to main and the tags.
      - name: Checkout (with SpriteStudio-SDK submodule)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Committed here, before anything is built, so the commit holds the version
      # change and nothing else; it is pushed only after the build has passed.
      - name: Set the versions
        if: inputs.versions != ''
        env:
          VERSIONS: ${{ inputs.versions }}
        run: |
          # One argument per pair, so the split is the point.
          # shellcheck disable=SC2086
          node scripts/set-versions.mjs $VERSIONS
          node scripts/sync-doc-versions.mjs
          git add -A
          git commit -m "chore(release): $VERSIONS"

      # scripts/build-release.sh IS the release build: the wasm, the build, the
      # tests, the npm tarballs and the plugin archives, then the checks only a
      # finished artifact can show. Everything published or attached below comes
      # out of release-dist/, so what goes out is what was checked. Every option
      # is spelled out, so a release cannot change because a default did.
      - name: Build, test and check the release
        run: ./scripts/build-release.sh skip=install sdk=download out=release-dist verify=yes clean=yes

      # A Release carries a link to its package's CHANGELOG.md and no notes of
      # its own, so a version without a section there would go out with nothing
      # to say. set-versions.mjs writes the section for the versions it sets; a
      # run with `versions` empty releases what main already carries, and this is
      # where a version nobody wrote notes for stops.
      - name: Check the changelogs
        env:
          RELEASE_PLUGINS: ${{ inputs.release_plugins }}
        run: |
          set -euo pipefail
          status=0
          while IFS=$'\t' read -r dir version; do
            if ! awk -v h="## [${version}] - " 'index($0, h) == 1 { found = 1 } END { exit !found }' "packages/${dir}/CHANGELOG.md" 2>/dev/null; then
              echo "::error::packages/${dir}/CHANGELOG.md has no '## [${version}]' section."
              status=1
            fi
          done < <(jq -r --arg plugins "$RELEASE_PLUGINS" '
            (.npm[]), (if $plugins == "true" then .plugins[] else empty end)
            | [.dir, .version] | @tsv' release-dist/manifest.json)
          exit "$status"

      # A main that moved during the run rejects this push, and the run stops
      # before anything is published.
      - name: Push the version commit
        if: inputs.versions != ''
        run: git push origin HEAD:main

      - name: Tag and draft the Releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PLUGINS: ${{ inputs.release_plugins }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"

          # Which packages, under which tag, with which file, all comes from the
          # manifest build-release.sh wrote, so a new package needs no change here.
          rows="$(jq -r --arg plugins "$RELEASE_PLUGINS" '
            (.npm[] | [.package, .dir, .version, .file]),
            (if $plugins == "true" then .plugins[] | [.package, .dir, .version, .file] else empty end)
            | @tsv' release-dist/manifest.json)"
          if [ -z "$rows" ]; then
            echo "::error::Nothing selected to release."
            exit 1
          fi

          while IFS=$'\t' read -r name dir version file; do
            tag="${dir}-v${version}"
            if gh release view "$tag" > /dev/null 2>&1; then
              echo "::notice::${tag} already has a Release — skipping."
              continue
            fi
            # A run that tagged and then died left the tag behind; it is reused.
            if ! git rev-parse -q --verify "refs/tags/${tag}" > /dev/null; then
              git tag -a "$tag" -m "$tag" "$sha"
              git push origin "refs/tags/${tag}"
            fi
            notes="See [CHANGELOG.md](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${tag}/packages/${dir}/CHANGELOG.md) for what changed."
            args=(--verify-tag --title "${name} ${version}" --notes "$notes" --draft)
            case "$version" in *-*) args+=(--prerelease) ;; esac
            gh release create "$tag" "release-dist/${file}" "${args[@]}"
            echo "::notice::Drafted ${tag} — check it and publish it from the Releases page."
          done <<< "$rows"

      # npm 11.21 is the first CLI that sets a dist-tag through trusted
      # publishing, and Node 22 ships npm 10.
      - name: Update npm
        if: inputs.publish_npm
        run: npm install -g npm@11.21.0

      # Last, so that a failure here leaves the tags and the drafts in place, for
      # a re-run with `versions` empty or a maintainer to finish. npm lists a
      # staged version only once it is approved, so staging one again is refused
      # with a 409, which is skipped like a version npm already has.
      - name: Stage on npm
        if: inputs.publish_npm
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r name version file; do
            if [ -n "$(npm view "${name}@${version}" version 2>/dev/null || true)" ]; then
              echo "::notice::${name}@${version} is already on npm — skipping."
              continue
            fi
            case "$version" in
              *-*) dist_tag="${version#*-}"; dist_tag="${dist_tag%%.*}" ;;
              *)   dist_tag="latest" ;;
            esac
            if ! out="$(npm stage publish "release-dist/${file}" --tag "$dist_tag" --access public 2>&1)"; then
              echo "$out"
              if grep -qE "409 Conflict.*previously (published|staged) version \"${version}\"" <<< "$out"; then
                echo "::notice::${name}@${version} is already staged — skipping."
                continue
              fi
              exit 1
            fi
            echo "$out"
            echo "::notice::Staged ${name}@${version} under '${dist_tag}' — approve it on npmjs.com or with npm stage approve."
          done < <(jq -r '.npm[] | [.package, .version, .file] | @tsv' release-dist/manifest.json)
