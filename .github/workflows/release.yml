name: Release

# One release, dispatched by hand from main. A maintainer names the versions;
# everything after that is this workflow's, and the same ref with the same inputs
# always produces the same result:
#
#   versions          `<package>@<version>` pairs separated by spaces, <package>
#                     being the directory under packages/. scripts/set-versions.mjs
#                     writes them and sync-doc-versions.mjs repoints the
#                     version-pinned docs snippets, in one commit that reaches main
#                     only once the build below has passed. Empty sets nothing and
#                     releases whatever current version is not released yet: the
#                     first release, and the retry after a run that died halfway.
#
#   publish_npm       Each PUBLIC package's tarball -- the very file
#                     scripts/build-release.sh packed and checked -- goes to npm,
#                     unless npm already has that version. A version with a
#                     prerelease part (X.Y.Z-beta.N) goes under that word's
#                     dist-tag, so `latest` stays on the last full release and a
#                     consumer asks for `<pkg>@beta` meanwhile.
#
#   release_plugins   The PRIVATE plugins (ssplayer-rmmz / ssplayer-tyranoscript /
#                     ssplayer-tyranobuilder) are never on npm; their Release, with
#                     the archive attached, is their only channel.
#
# Every package released here gets a `<package>-v<version>` tag and a DRAFT
# GitHub Release, notes generated from the pull requests since its previous tag.
# A package whose Release already exists, draft or not, is skipped, so a re-run
# never doubles one. A maintainer edits each draft and publishes it, and
# publishing is what starts pages.yml.
#
# Requires the SS_NPM_TOKEN secret (an npm automation token -- automation tokens
# bypass 2FA, which CI cannot satisfy interactively).
on:
  workflow_dispatch:
    inputs:
      versions:
        description: 'Versions to set: <package>@<version>, space separated, <package> = directory under packages/. Empty releases the current versions.'
        type: string
        default: ''
      publish_npm:
        description: 'Publish the public packages to npm and draft their Releases'
        type: boolean
        default: true
      release_plugins:
        description: 'Draft the Releases of the private plugins (rmmz / tyranoscript / tyranobuilder)'
        type: boolean
        default: true

# Never let two releases run at once.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # the version commit, the tags and the Releases
  id-token: write # npm provenance (see NPM_CONFIG_PROVENANCE below)

jobs:
  release:
    # Refuse to release from anywhere but main, even if dispatched on another ref.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with SpriteStudio-SDK submodule)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Committed here, before anything is built, so the commit holds the version
      # change and nothing else; it is pushed only after the build has passed.
      - name: Set the versions
        if: inputs.versions != ''
        env:
          VERSIONS: ${{ inputs.versions }}
        run: |
          # One argument per pair, so the split is the point.
          # shellcheck disable=SC2086
          node scripts/set-versions.mjs $VERSIONS
          node scripts/sync-doc-versions.mjs
          git add -A
          git commit -m "chore(release): $VERSIONS"

      # scripts/build-release.sh IS the release build: the wasm, the build, the
      # tests, the npm tarballs and the plugin archives, then the checks only a
      # finished artifact can show. Everything published or attached below comes
      # out of release-dist/, so what goes out is what was checked. Every option
      # is spelled out, so a release cannot change because a default did.
      - name: Build, test and check the release
        run: ./scripts/build-release.sh skip=install sdk=download out=release-dist verify=yes clean=yes

      # A main that moved during the run rejects this push, and the run stops
      # before anything is published.
      - name: Push the version commit
        if: inputs.versions != ''
        run: git push origin HEAD:main

      - name: Publish to npm
        if: inputs.publish_npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.SS_NPM_TOKEN }}
          # npm provenance attestation needs a PUBLIC repository (plus the
          # id-token: write permission above, which is already granted). This
          # repo is still private, and npm rejects the publish outright rather
          # than degrading, so provenance stays off. Flip to 'true' the moment
          # the repo goes public — nothing else has to change.
          NPM_CONFIG_PROVENANCE: 'false'
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r name version file; do
            if [ -n "$(npm view "${name}@${version}" version 2>/dev/null || true)" ]; then
              echo "::notice::${name}@${version} is already on npm — skipping."
              continue
            fi
            case "$version" in
              *-*) dist_tag="${version#*-}"; dist_tag="${dist_tag%%.*}" ;;
              *)   dist_tag="latest" ;;
            esac
            npm publish "release-dist/${file}" --tag "$dist_tag" --access public
          done < <(jq -r '.npm[] | [.package, .version, .file] | @tsv' release-dist/manifest.json)

      - name: Tag and draft the Releases
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_NPM: ${{ inputs.publish_npm }}
          RELEASE_PLUGINS: ${{ inputs.release_plugins }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"

          # Which packages, under which tag, with which file, all comes from the
          # manifest build-release.sh wrote, so a new package needs no change here.
          rows="$(jq -r --arg npm "$PUBLISH_NPM" --arg plugins "$RELEASE_PLUGINS" '
            (if $npm == "true" then .npm[] | [.package, .dir, .version, "-"] else empty end),
            (if $plugins == "true" then .plugins[] | [.package, .dir, .version, .file] else empty end)
            | @tsv' release-dist/manifest.json)"
          if [ -z "$rows" ]; then
            echo "::error::Nothing selected to release."
            exit 1
          fi

          while IFS=$'\t' read -r name dir version file; do
            tag="${dir}-v${version}"
            if gh release view "$tag" > /dev/null 2>&1; then
              echo "::notice::${tag} already has a Release — skipping."
              continue
            fi
            # The notes start at this package's previous tag. A prerelease sorts
            # below its full release, so 7.0.1 starts at 7.0.0, not at 7.0.0-beta.N.
            previous="$(git -c versionsort.suffix=- tag --list "${dir}-v*" --sort=-v:refname | grep -vx "$tag" | head -n 1 || true)"
            # A run that tagged and then died left the tag behind; it is reused.
            if ! git rev-parse -q --verify "refs/tags/${tag}" > /dev/null; then
              git tag -a "$tag" -m "$tag" "$sha"
              git push origin "refs/tags/${tag}"
            fi
            args=(--verify-tag --title "${name} ${version}" --generate-notes --draft)
            if [ -n "$previous" ]; then args+=(--notes-start-tag "$previous"); fi
            case "$version" in *-*) args+=(--prerelease) ;; esac
            if [ "$file" = "-" ]; then
              gh release create "$tag" "${args[@]}"
            else
              gh release create "$tag" "release-dist/${file}" "${args[@]}"
            fi
            echo "::notice::Drafted ${tag} — edit its notes and publish it from the Releases page."
          done <<< "$rows"
