name: Deploy Pages

# Serve docs (VitePress), ssconverter-web (every schema version) and the examples
# — pixi, webgl, the static RPG Maker MZ SampleProject (rmmz), and the static
# TyranoScript project (tyrano) — from GitHub Pages as a single site. Deployed via
# the artifact method — no gh-pages branch.
#
# A published release or a manual dispatch rebuilds the site, and nothing else does
# — the same trigger pair every sibling repository uses. A full rebuild (every
# ssconverter schema version + all examples) is far too heavy to run per merge, and
# the Release workflow cuts the plugin GitHub Releases, so `release: published`
# already fires after a release. Use "Run workflow" for an immediate refresh — e.g.
# a docs fix that should not wait for the next release.
on:
  release:
    types: [published]
  workflow_dispatch:

# Least-privilege: the build job only needs to read the repo; the Pages write /
# OIDC token permissions are granted to the deploy job alone (see below).
permissions:
  contents: read

# Never run two deploys at once; let an in-progress deploy finish rather than
# cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with SpriteStudio-SDK submodule)
        uses: actions/checkout@v7
        with:
          submodules: recursive
          # Full history + tags so build-ssconverter-pages.sh can build a version
          # from a pinned git ref (versions.json "ref") in a worktree.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # Everything that produces a file lives in scripts/build-pages.sh — the
      # dependencies, the wasm, the packages, the example assets, the docs, the
      # examples, every ssconverter schema version, and the _site assembly. A
      # contributor runs the same script to build the whole site locally
      # (`scripts/build-pages.sh --help`), so CI and a local build cannot drift.
      # That matters more here than anywhere else in this repo: nothing builds
      # the site on a pull request, so there is no PR run to catch the two
      # falling out of step.
      #
      # base is the Pages base path — a project site is served under /<repo>/.
      - name: Build site
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: ./scripts/build-pages.sh base="/$REPO_NAME/" out=_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Only the deploy job needs to publish the Pages artifact + mint the OIDC token.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
