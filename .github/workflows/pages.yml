name: Deploy Pages

# Serve docs (VitePress), ssconverter-web (every schema version) and the examples
# — pixi, webgl, the static RPG Maker MZ SampleProject (rmmz), and the static
# TyranoScript project (tyrano) — from GitHub Pages as a single site. Deployed via
# the artifact method — no gh-pages branch.
#
# A published release or a manual dispatch rebuilds the site, and nothing else does
# — the same trigger pair every sibling repository uses. A full rebuild (every
# ssconverter schema version + all examples) is far too heavy to run per merge, and
# the Release workflow cuts the plugin GitHub Releases, so `release: published`
# already fires after a release. Use "Run workflow" for an immediate refresh — e.g.
# a docs fix that should not wait for the next release.
on:
  release:
    types: [published]
  workflow_dispatch:

# Least-privilege: the build job only needs to read the repo; the Pages write /
# OIDC token permissions are granted to the deploy job alone (see below).
permissions:
  contents: read

# Never run two deploys at once; let an in-progress deploy finish rather than
# cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with SpriteStudio-SDK submodule)
        uses: actions/checkout@v7
        with:
          submodules: recursive
          # Full history + tags so build-ssconverter-pages.sh can build a version
          # from a pinned git ref (versions.json "ref") in a worktree.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # wasm is not tracked in git. Fetch the runtime/converter wasm for the
      # version in SDK_VERSION.txt — needed to build the packages and examples.
      # (Each ssconverter schema version's wasm is re-fetched per-version later
      # by build-ssconverter-pages.sh based on versions.json.)
      - name: Download SDK WASM (runtime + converter)
        run: pnpm run download:wasm

      - name: Build packages
        run: pnpm run build

      # Generate the .ssab assets the examples load, from the SpriteStudio-SDK
      # test projects.
      - name: Generate example assets
        run: pnpm run deploy-examples

      # rmmz-example is a static RPG Maker MZ project (no bundler). Sync the built
      # plugin + no-SIMD runtime wasm into its js/plugins/ (deploy-examples already
      # produced the .ssab under SampleProject/spritestudio/).
      - name: Sync rmmz-example plugin
        run: pnpm --filter rmmz-example run sync:plugin

      # tyranoscript-example is a static TyranoScript project. Fetch the (git-ignored)
      # engine (index.html + tyrano/ + data/system/) pinned by TYRANO_VERSION.txt,
      # then sync the built plugin + runtime wasm into its plugin folder.
      # (deploy-examples already placed the Ringo .ssab under data/others/ssdata/.)
      - name: Fetch TyranoScript engine
        run: pnpm --filter tyranoscript-example run fetch:engine
      - name: Sync tyranoscript-example plugin
        run: pnpm --filter tyranoscript-example run sync:plugin

      # Pages base path (a project site is served under /<repo>/).
      - name: Compute site base path
        run: echo "SITE_BASE=/${{ github.event.repository.name }}/" >> "$GITHUB_ENV"

      # docs (VitePress): scripts/build-docs.sh is what a contributor runs, so the
      # docs build is spelled out in one place — TypeDoc, then VitePress, with
      # base passed through as DOCS_BASE (config.mts reads it). Nothing builds the
      # docs on a pull request, so there is no PR run to catch CI and the scripts
      # drifting apart.
      #
      # Its companion scripts/prepare-docs.sh is deliberately *not* used here: it
      # is `pnpm install` + `download:wasm`, which this job already ran above for
      # the packages, the examples and the converter — not for the docs alone.
      - name: Build docs
        run: ./scripts/build-docs.sh base="$SITE_BASE"

      # examples: base is injected via vite's --base CLI (configs left untouched).
      - name: Build examples
        run: |
          pnpm --filter=pixi-example exec vite build --base="${SITE_BASE}examples/pixi/"
          pnpm --filter=webgl-example exec vite build --base="${SITE_BASE}examples/webgl/"
          pnpm --filter=override-example exec vite build --base="${SITE_BASE}examples/override/"

      # ssconverter-web: build every schema version from versions.json into
      # _site/ssconverter/<schema>/.
      - name: Build ssconverter-web (all schema versions)
        run: bash scripts/build-ssconverter-pages.sh _site

      # Collect the outputs into _site (docs at the root, the rest under subpaths).
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -R docs/.vitepress/dist/. _site/
          mkdir -p _site/examples/pixi  && cp -R examples/pixi-example/dist/.  _site/examples/pixi/
          mkdir -p _site/examples/webgl && cp -R examples/webgl-example/dist/. _site/examples/webgl/
          mkdir -p _site/examples/override && cp -R examples/override-example/dist/. _site/examples/override/
          # rmmz-example: copy the static MZ project as-is (relative paths, so it
          # runs fine under the /examples/rmmz/ subpath — no base rewrite needed).
          mkdir -p _site/examples/rmmz  && cp -R examples/rmmz-example/SampleProject/. _site/examples/rmmz/
          # tyranoscript-example: copy the static TyranoScript project (engine + data,
          # relative paths) as-is under /examples/tyranoscript/.
          mkdir -p _site/examples/tyranoscript && cp -R examples/tyranoscript-example/index.html examples/tyranoscript-example/tyrano examples/tyranoscript-example/data _site/examples/tyranoscript/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Only the deploy job needs to publish the Pages artifact + mint the OIDC token.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
