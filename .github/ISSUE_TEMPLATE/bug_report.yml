name: 🛠️ Bug report / 不具合の報告
description: Something in the player behaves incorrectly. / プレイヤーの動作に問題がある場合。
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this.

        Before filing, please [search existing issues](https://github.com/cri-middleware/SSPlayerForWeb/issues?q=is%3Aissue).
        **Do not attach proprietary `.sspj` files here** — this is a public tracker. Send them privately through the
        [Japanese Help Center form](https://www.webtech.co.jp/help/ja/spritestudio7/inquiries/ssplayer_tool/), which takes a zip of up to 8 MB.

        投稿前に既存の Issue を検索してください。**業務データの `.sspj` は公開の場である本 Issue に添付しないでください。** 送付が必要な場合は[ヘルプセンター](https://www.webtech.co.jp/help/ja/spritestudio7/inquiries/ssplayer_tool/)をご利用ください（8 MB までの zip を添付できます）。

  - type: textarea
    id: what-happened
    attributes:
      label: What happened? / 症状
      description: What you expected, and what you got instead. / 期待した挙動と、実際の挙動。
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce / 再現手順
      description: |
        The smallest sequence that shows the problem. A minimal `.ssab` helps a lot.
        問題を再現できる最小限の手順。最小限の `.ssab` があると助かります。
      placeholder: |
        1. Import @spritestudio/...
        2. Load the .ssab
        3. Play "..."
        4. See ...
    validations:
      required: true

  - type: dropdown
    id: package
    attributes:
      label: Which package? / 対象パッケージ
      options:
        - "@spritestudio/ssplayer-webgl"
        - "@spritestudio/ssplayer-pixi"
        - "@spritestudio/ssplayer-rmmz"
        - "@spritestudio/ssplayer-tyranoscript"
        - "@spritestudio/ssplayer-tyranobuilder"
        - "@spritestudio/ssplayer-core"
        - "@spritestudio/ssconverter-core"
        - "@spritestudio/ssconverter-web"
        - Not sure / わからない
    validations:
      required: true

  - type: input
    id: package-version
    attributes:
      label: Package version / パッケージのバージョン
      placeholder: 7.0.0-beta.1
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and version / ブラウザとバージョン
      placeholder: Chrome 141 / Safari 19 / Firefox 148
    validations:
      required: true

  - type: dropdown
    id: host
    attributes:
      label: How is it loaded? / 読み込み方法
      options:
        - Bundler (Vite, webpack, Rollup, …)
        - RPG Maker MZ project
        - TyranoScript
        - TyranoBuilder
        - Plain <script> tag
        - Other / その他

  - type: input
    id: os
    attributes:
      label: Operating system / OS
      placeholder: macOS 26 / Windows 11 / Ubuntu 24.04

  - type: textarea
    id: logs
    attributes:
      label: Browser console / コンソール出力
      description: Any errors, warnings, or stack traces. / エラー・警告・スタックトレース。
      render: text

  - type: textarea
    id: other-players
    attributes:
      label: Does it reproduce on another SpriteStudio player? / 他の SpriteStudio Player でも再現しますか？
      description: |
        If it does, the cause is most likely the shared SpriteStudio runtime rather than this
        player, and saying so here saves a round trip.
        再現する場合は、この Player 固有ではなく共通ランタイム側の可能性が高いため、その旨をお書きください。
